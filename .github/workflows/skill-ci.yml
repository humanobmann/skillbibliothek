name: Skill library validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m compileall -q scripts skills tests
      - run: python scripts/validate_skills.py --strict
      - run: python scripts/validate_social_evidence.py
      - run: python -m pytest -q tests
